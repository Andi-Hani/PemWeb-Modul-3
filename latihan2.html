<!DOCTYPE html>
<html lang="en">

<head>
    <title>Latihan Grid Bootstrap</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .pink {
            background-color: #FFD6E8;
        }

        .blue {
            background-color: #CFE8FF;
        }

        .yellow {
            background-color: #FFF3BF;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row">

            <div class="col pink p-3">
                Kolom pertama berisi informasi tentang Bootstrap.
            </div>

            <div class="col blue p-3">
                Kolom kedua berisi contoh penggunaan Grid System.
            </div>

            <div class="col yellow p-3">
                Kolom ketiga menunjukkan tampilan yang responsif.
            </div>

        </div>
    </div>

</body>

</html>
